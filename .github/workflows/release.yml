# SPDX-License-Identifier: AGPL-3.0-only
name: Release

# Push a tag like v0.1.0 (docs: apps/web/content/docs/operations/upgrade.md):
#  - images ghcr.io/inframole/{web,migrate,backup}:<version> and :latest
#    (linux/amd64 + linux/arm64), built from this public source (AGPL §6);
#  - the self-hosted bundle (compose + Caddyfile + .env.example + scripts +
#    README) and its SHA-256 as assets of this repository's release.
#
# Each architecture builds on a native runner (no QEMU: emulated arm64 builds
# of the web image crashed with SIGILL), pushes by digest, and a merge job
# publishes one multi-arch manifest per image.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGES: ghcr.io/inframole

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        image:
          - { name: web, context: ., file: apps/web/Dockerfile, target: runner }
          - { name: migrate, context: ., file: apps/web/Dockerfile, target: migrate }
          - { name: backup, context: deploy, file: deploy/backup.Dockerfile, target: "" }
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: |
            org.opencontainers.image.title=InfraMole ${{ matrix.image.name }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          outputs: type=image,name=${{ env.IMAGES }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
      - name: Record digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        name: [web, migrate, backup]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.name }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="$IMAGES/${{ matrix.name }}"
          docker buildx imagetools create -t "$image:$version" -t "$image:latest" \
            $(printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "$image:$version"

  bundle:
    needs: merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          node deploy/scripts/make-bundle.mjs "$version" dist
          # The bundle must be a valid compose project on its own.
          cp dist/inframole-self-hosted/.env.example dist/inframole-self-hosted/.env
          sed -i 's/^DEPMAP_DOMAIN=.*/DEPMAP_DOMAIN=example.com/' dist/inframole-self-hosted/.env
          sh dist/inframole-self-hosted/scripts/gen-secrets.sh dist/inframole-self-hosted/.env > /dev/null
          (cd dist/inframole-self-hosted && docker compose config -q)
          rm dist/inframole-self-hosted/.env
          tar -C dist -czf dist/inframole-self-hosted.tar.gz inframole-self-hosted
          (cd dist && sha256sum inframole-self-hosted.tar.gz > inframole-self-hosted.tar.gz.sha256)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: this version's section of CHANGELOG.md.
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## " v " ") == 1 {f = 1; next} f && /^## / {exit} f' CHANGELOG.md > notes.md
          printf '\n---\n\nInstall or update: https://inframole.com/docs/operations/upgrade — images `ghcr.io/inframole/{web,migrate,backup}:%s`. Licence: AGPL-3.0-only.\n' "${GITHUB_REF_NAME#v}" >> notes.md
          gh release create "$GITHUB_REF_NAME" \
            dist/inframole-self-hosted.tar.gz dist/inframole-self-hosted.tar.gz.sha256 \
            --title "InfraMole ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
